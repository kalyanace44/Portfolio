<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VegaPay x YesBank - VPC Traffic Flow Simulator — Security Gateway</title>
  
  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- CryptoJS Decryptor -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

  <style>
    :root {
      --bg-dark: #05070f;
      --bg-panel: rgba(10, 15, 28, 0.85);
      --border-color: rgba(255, 255, 255, 0.05);
      --border-glow: rgba(0, 245, 255, 0.15);
      --color-primary: #00f5ff;
      --color-secondary: #9d4edd;
      --color-text: #f3f4f6;
      --color-text-muted: #8b9bb4;
      --font-outfit: 'Outfit', sans-serif;
      --font-inter: 'Inter', sans-serif;
      --font-mono: 'Fira Code', monospace;
      --glow-cyan: 0 0 20px rgba(0, 245, 255, 0.2);
      --glow-purple: 0 0 20px rgba(157, 78, 221, 0.2);
    }

    html.light-theme {
      --bg-dark: #f2efe9;
      --bg-panel: rgba(243, 240, 234, 0.85);
      --border-color: rgba(110, 96, 92, 0.12);
      --border-glow: rgba(212, 138, 151, 0.25);
      --color-primary: #000000;
      --color-secondary: #d48a97;
      --color-text: #1a1a1a;
      --color-text-muted: #6e605c;
      --glow-cyan: 0 0 15px rgba(0, 0, 0, 0.08);
      --glow-purple: 0 0 15px rgba(212, 138, 151, 0.15);
    }

    body {
      background-color: var(--bg-dark);
      color: var(--color-text);
      font-family: var(--font-inter);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      overflow: hidden;
      position: relative;
    }

    /* Grid overlay background */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(to right, rgba(0, 245, 255, 0.012) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 245, 255, 0.012) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: -2;
      pointer-events: none;
    }
    html.light-theme::before {
      background-image: 
        linear-gradient(to right, rgba(212, 138, 151, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(212, 138, 151, 0.04) 1px, transparent 1px);
    }

    /* Floating radial glows */
    .glow-bg-1 {
      position: absolute;
      top: -10%;
      left: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0, 245, 255, 0.04) 0%, transparent 70%);
      z-index: -1;
      pointer-events: none;
    }
    html.light-theme .glow-bg-1 {
      background: radial-gradient(circle, rgba(212, 138, 151, 0.09) 0%, transparent 70%);
    }

    /* Topbar Header */
    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 0.75rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      background: rgba(5, 7, 15, 0.4);
      backdrop-filter: blur(10px);
      z-index: 100;
    }
    html.light-theme .topbar {
      background: rgba(242, 239, 233, 0.4);
    }

    .btn-back {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--color-text-muted);
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.02);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      text-decoration: none;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-back:hover {
      color: var(--color-primary);
      border-color: var(--color-primary);
      background: rgba(0, 245, 255, 0.05);
      transform: translateX(-3px);
    }
    html.light-theme .btn-back:hover {
      background: rgba(212, 138, 151, 0.05);
      border-color: var(--color-secondary);
      color: var(--color-secondary);
    }

    /* Theme Toggle */
    .theme-toggle-btn {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      color: var(--color-text-muted);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .theme-toggle-btn:hover {
      color: var(--color-primary);
      border-color: var(--color-primary);
      background: rgba(0, 245, 255, 0.05);
      transform: translateY(-2px) rotate(15deg);
    }
    html.light-theme .theme-toggle-btn:hover {
      background: rgba(212, 138, 151, 0.1);
      border-color: var(--color-secondary);
      color: var(--color-secondary);
    }
    .theme-toggle-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
    }
    .theme-toggle-btn .sun-icon { display: block; }
    .theme-toggle-btn .moon-icon { display: none; }
    html.light-theme .theme-toggle-btn .sun-icon { display: none; }
    html.light-theme .theme-toggle-btn .moon-icon { display: block; }

    /* Login Card container */
    #auth-container {
      width: 100%;
      max-width: 440px;
      padding: 3rem 2.5rem;
      background: rgba(10, 15, 28, 0.75);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(0, 245, 255, 0.15);
      border-radius: 16px;
      box-shadow: 0 0 40px rgba(0, 245, 255, 0.08), inset 0 0 20px rgba(255, 255, 255, 0.02);
      font-family: var(--font-outfit), sans-serif;
      text-align: center;
      z-index: 10;
      position: relative;
      animation: auth-fade-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    html.light-theme #auth-container {
      background: rgba(243, 240, 234, 0.85);
      border-color: rgba(110, 96, 92, 0.2);
      box-shadow: 0 10px 40px rgba(110, 96, 92, 0.1);
    }

    @keyframes auth-fade-in {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes auth-shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .auth-shake-anim {
      animation: auth-shake 0.4s ease-in-out;
      border-color: rgba(239, 68, 68, 0.5) !important;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.2) !important;
    }
    .auth-input-focus {
      border-color: var(--color-primary) !important;
      box-shadow: 0 0 15px var(--border-glow) !important;
    }

    #auth-container h2 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #f3f4f6;
      margin: 0 0 0.5rem 0;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #f3f4f6 0%, #8b9bb4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    html.light-theme #auth-container h2 {
      background: linear-gradient(135deg, #1a1a1a 0%, #6e605c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #auth-password {
      width: 100%;
      padding: 14px 16px;
      background: rgba(5, 7, 15, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      color: #f3f4f6;
      font-family: var(--font-mono);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-align: center;
    }
    html.light-theme #auth-password {
      background: rgba(255, 255, 255, 0.9);
      border-color: rgba(110, 96, 92, 0.2);
      color: #1a1a1a;
    }

    #auth-form button {
      background: linear-gradient(135deg, #00f5ff 0%, #9d4edd 100%);
      color: #05070f;
      border: none;
      padding: 14px;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 20px rgba(0, 245, 255, 0.25);
      font-family: var(--font-outfit), sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 0.5rem;
      width: 100%;
    }
    html.light-theme #auth-form button {
      background: linear-gradient(135deg, #1a1a1a 0%, #d48a97 100%);
      color: #f2efe9;
      box-shadow: 0 4px 15px rgba(212, 138, 151, 0.2);
    }
  </style>
  <script>
    // Restore theme preference immediately
    const savedTheme = localStorage.getItem('portfolio-theme');
    if (savedTheme === 'light') {
      document.documentElement.classList.add('light-theme');
    }
  </script>
</head>

    // SHA-256 hash of the password "aws-traffic-2026"
    const CORRECT_HASH = 'f2e15f71628034ebfe8c173d060d205ca5f92b3367592a301caccc7aca6e19e6';

    // Session validation helpers
    function setSessionActive() {
      try {
        sessionStorage.setItem('portfolio_session_active', 'true');
      } catch (e) {}
      try {
        // Set cookie without expires attribute (session cookie)
        document.cookie = "portfolio_session_active=true; path=/; SameSite=Strict";
      } catch (e) {}
      try {
        localStorage.setItem('portfolio_last_active', Date.now().toString());
      } catch (e) {}
    }

    function isSessionActive() {
      let active = false;
      try {
        if (sessionStorage.getItem('portfolio_session_active') === 'true') {
          active = true;
        }
      } catch (e) {}
      
      try {
        const value = "; " + document.cookie;
        if (value.indexOf("; portfolio_session_active=true") !== -1) {
          active = true;
        }
      } catch (e) {}
      
      if (window.location.protocol === 'file:') {
        try {
          const lastActive = localStorage.getItem('portfolio_last_active');
          if (lastActive && (Date.now() - parseInt(lastActive)) < 30 * 60 * 1000) {
            active = true;
          }
        } catch (e) {}
      }
      
      return active;
    }

    function clearSession() {
      try {
        sessionStorage.removeItem('portfolio_session_active');
      } catch (e) {}
      try {
        document.cookie = "portfolio_session_active=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT; SameSite=Strict";
      } catch (e) {}
      try {
        localStorage.removeItem('portfolio_last_active');
      } catch (e) {}
    }

    // Decrypt and replace document stream
    function decryptAndRender(passwordVal) {
      try {
        const decrypted = CryptoJS.AES.decrypt(ciphertext, passwordVal);
        const decryptedHtml = decrypted.toString(CryptoJS.enc.Utf8);
        
        if (decryptedHtml.startsWith('<!DOCTYPE html>') || decryptedHtml.includes('html') || decryptedHtml.length > 500) {
          // Success! Save auth parameters to localStorage so they are shared across subpages
          try {
            localStorage.setItem('portfolio_auth_key', passwordVal);
            localStorage.setItem('portfolio_auth_token', CORRECT_HASH);
          } catch (e) {}
          
          // Mark session active
          setSessionActive();
          
          // Re-write document stream with decrypted markup
          document.open();
          document.write(decryptedHtml);
          document.close();
          return true;
        }
      } catch (e) {
        // Fall through on decryption failure
      }
      return false;
    }

    // Defer the auto-decrypt check slightly to ensure the document parsing finishes,
    // which prevents the browser from preserving wrapper elements in the replaced DOM.
    setTimeout(() => {
      // Check if this is a valid active session.
      // If the browser was closed/restarted or opened in a fresh session, we reset auth state.
      const sessionActive = isSessionActive();
      if (!sessionActive) {
        try {
          localStorage.removeItem('portfolio_auth_key');
          localStorage.removeItem('portfolio_auth_token');
        } catch (e) {}
      }

      // Check if we have a saved key (persisted in localStorage for cross-subpage ease)
      let savedKey = null;
      try {
        savedKey = localStorage.getItem('portfolio_auth_key');
      } catch (e) {}

      let autoDecrypted = false;
      if (savedKey) {
        autoDecrypted = decryptAndRender(savedKey);
        if (autoDecrypted) {
          // Verify session remains marked active
          setSessionActive();
        } else {
          // Cleanup on decryption failure
          clearSession();
          try {
            localStorage.removeItem('portfolio_auth_key');
            localStorage.removeItem('portfolio_auth_token');
          } catch (e) {}
        }
      }

      // If we couldn't auto-decrypt, show the security gateway screen
      if (!autoDecrypted) {
        container.style.display = 'block';
        input.focus();
        input.addEventListener('focus', () => input.classList.add('auth-input-focus'));
        input.addEventListener('blur', () => input.classList.remove('auth-input-focus'));
      }
    }, 0);

    // Submit listener
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const enteredValue = input.value;
      const success = decryptAndRender(enteredValue);
      
      if (!success) {
        // Shake container and display error feedback
        container.classList.remove('auth-shake-anim');
        void container.offsetWidth; // Reflow trigger
        container.classList.add('auth-shake-anim');
        errorEl.style.opacity = '1';
        input.value = '';
        input.focus();
        setTimeout(() => {
          container.classList.remove('auth-shake-anim');
        }, 400);
      }
    });
